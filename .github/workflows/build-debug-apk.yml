name: Build debug APK
# Debug APKs are signed with the stable test keystore (see TEST_KEYSTORE_* secrets),
# so each CI build installs over the previous one instead of requiring an uninstall.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up test signing key
        run: |
          if [ -n "${{ secrets.TEST_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TEST_KEYSTORE_BASE64 }}" | base64 -d > app/test-keystore.jks
            cat > app/key.properties <<EOF
            storeFile=test-keystore.jks
            storePassword=${{ secrets.TEST_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.TEST_KEY_ALIAS }}
            keyPassword=${{ secrets.TEST_KEY_PASSWORD }}
            EOF
            echo "Test signing key configured"
          else
            echo "No test signing key secret found, falling back to the default debug key"
          fi

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*-debug*.apk | head -n 1)
          echo "APK: $APK"
          keytool -printcert -jarfile "$APK" | grep -i "SHA256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
